services:
  yt-api:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - yt_api_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
    command: sh -c "npm install && node server.js"
    restart: unless-stopped

  ai-mentor:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - ai_mentor_node_modules:/app/node_modules
    ports:
      - "3001:3001"
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
    command: sh -c "npm install ws dotenv @supabase/supabase-js && node mentor-server.js"
    restart: unless-stopped

  ai-express:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - ai_express_node_modules:/app/node_modules
    ports:
      - "3002:3002"
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
    command: sh -c "npm install express cors @google/generative-ai @supabase/supabase-js dotenv node-fetch && node ai-server.js"
    restart: unless-stopped

volumes:
  yt_api_node_modules:
  ai_mentor_node_modules:
  ai_express_node_modules: