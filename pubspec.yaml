name: lingo_sync
description: "Best application for learn english with specific planner"

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.15.4
  flutter_riverpod: ^3.3.2
  intl: ^0.20.3
  flutter_dotenv: ^6.0.1
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.5
  record: ^7.1.1
  web_socket_channel: ^3.0.3
  path_provider: ^2.1.6
  just_audio: ^0.10.6
  riverpod_annotation: ^4.0.3
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  http: ^1.6.0
  image_picker: ^1.2.3
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5  
  build_runner:
  riverpod_generator:
  flutter_launcher_icons:

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons.png"
  adaptive_icon_background: "#1E1E1E"
  adaptive_icon_foreground: "assets/icons.png"